[package]
name = "pure_fat"
description = "A super flexible library for parsing FAT file systems"
version = "1.0.0"
edition = "2024"
repository = "https://github.com/ChocolateLoverRaj/pure_fat"
authors = ["Rajas Paranjpe"]
license = "AGPL-3.0-or-later"
categories = ["no-std", "embedded", "no-std::no-alloc", "filesystem", "parsing"]

[dependencies]
bitflags = "2.10.0"
defmt = { version = "1.0.1", default-features = false, optional = true }
heapless = "0.9.2"
oem_cp = { version = "2.1.2", default-features = false }
zerocopy = { version = "0.8.31", features = ["derive"] }

[dev-dependencies]
hex-display = "0.3.0"
sha2 = "0.11.0"

[features]
defmt = ["dep:defmt", "heapless/defmt"]
